<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Goal Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ?v=N: GitHub Pages serves these with a 10 min cache, bump N on every deploy. -->
  <link rel="stylesheet" href="styles.css?v=17" />
</head>
<body data-page="login">
  <main class="auth-page">
    <section class="auth-card panel">
      <a class="nav-back" href="index.html">← Back</a>

      <h1 class="auth-title">Sign in or create an account</h1>

      <p class="auth-subtitle">Sync your goals, skills and XP across devices. Without an account everything still works, but only on this device.</p>

      <button class="g-btn" id="googleBtn" type="button">
        <svg class="g-btn-logo" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <p class="auth-status" id="authStatus" role="status" hidden></p>

      <p class="auth-error" id="authError" role="alert" hidden></p>

      <div class="auth-account" id="authAccount" hidden>
        <span class="auth-avatar" id="authAvatar"></span>

        <div class="auth-account-meta">
          <strong id="authName"></strong>
          <span id="authEmail"></span>
        </div>

        <button class="mini-btn" id="signOutBtn" type="button">Sign out</button>
      </div>

      <a class="auth-guest" id="guestLink" href="index.html">Continue without an account</a>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase.init.js?v=2"></script>
  <script src="login.js?v=2"></script>
</body>
</html>
